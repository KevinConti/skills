<!doctype html>
<!--
  viewer.html - interactive-plan session viewer.

  Bidirectional: the user answers questions IN THE PAGE. Polls ./session.json +
  ./q-NN.json for results, POSTs intents to /intent. Agent is woken by wait.py.

  Layout: fold-locked. A thin top bar (progress) over two panes —
    Evidence (left): context + visual; swaps to an option's detail on hover/pin.
    Decision (right): question + compact option rows + freeform/Choose/Skip.
  A typical card fits one viewport; only genuinely verbose content scrolls, and
  it scrolls WITHIN a pane, never the page. Single theme, no build step.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>interactive-plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf7f5; --surface: #fffdfb; --recessed: #f3efe9;
      --border: rgba(30,58,95,.14); --border-strong: rgba(30,58,95,.30);
      --text: #1a1d24; --dim: #5c6573; --accent: #1e3a5f; --accent-dim: rgba(30,58,95,.08);
      --hi: #c98a16; --hi-dim: rgba(201,138,22,.12); --ok: #2e7d4f; --err: #b3261e; --err-dim: rgba(179,38,30,.08);
      --display: "Instrument Serif", Georgia, serif;
      --body: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    /* Dark variant. JS sets data-theme to the resolved value ("light"/"dark"),
       following the OS in "auto" mode or the user's explicit choice otherwise. */
    :root[data-theme="dark"] {
      --bg: #14181f; --surface: #1c2129; --recessed: #161b22;
      --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.22);
      --text: #ebe7df; --dim: #8a8d96; --accent: #7ba8d9; --accent-dim: rgba(123,168,217,.12);
      --hi: #e6c065; --hi-dim: rgba(230,192,101,.15); --ok: #6cc08a; --err: #f08a82; --err-dim: rgba(240,138,130,.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--body); color: var(--text); background: var(--bg);
      line-height: 1.55; -webkit-font-smoothing: antialiased;
      display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
    }

    /* ── Top bar ─────────────────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 22px;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .tb-slug { font-family: var(--display); font-size: 18px; color: var(--text); white-space: nowrap; }
    .tb-q { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--accent); white-space: nowrap; }
    .stepper { display: flex; align-items: center; gap: 7px; }
    .step {
      width: 9px; height: 9px; border-radius: 50%; padding: 0; cursor: pointer;
      border: 1px solid var(--border-strong); background: transparent; transition: background .16s, box-shadow .16s;
    }
    .step.resolved { background: var(--ok); border-color: var(--ok); }
    .step.parked { background: var(--dim); border-color: var(--dim); }
    .step.current { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .step:hover { box-shadow: 0 0 0 3px var(--accent-dim); }
    .tb-spacer { flex: 1; }
    .status {
      font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--dim); display: flex; align-items: center; gap: 6px; padding: 3px 11px;
      border: 1px solid var(--border); border-radius: 999px;
    }
    .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); transition: background .16s; }
    .status.live .dot { background: var(--ok); }
    .status.working .dot { background: var(--hi); animation: pulse 1s ease-in-out infinite; }
    .status.stale .dot { background: var(--err); }
    .theme-btn {
      font-family: var(--mono); font-size: 10px; text-transform: lowercase; letter-spacing: .04em;
      color: var(--dim); background: transparent; border: 1px solid var(--border); border-radius: 999px;
      padding: 3px 11px; cursor: pointer; transition: background .14s, color .14s;
    }
    .theme-btn:hover { background: var(--recessed); color: var(--text); }
    @keyframes pulse { 50% { opacity: .35; } }

    /* ── Panes ───────────────────────────────────────────────── */
    .panes { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); min-height: 0; overflow: hidden; }
    .evidence { overflow: auto; padding: 26px 28px; border-right: 1px solid var(--border); min-width: 0; }
    .decision { display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 26px 28px; }

    .lbl { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin: 0 0 9px; }
    .evidence p { margin: 0 0 11px; max-width: 62ch; }
    .evidence p:last-child { margin-bottom: 0; }
    .evidence strong { font-weight: 600; }

    .ev-section { margin-bottom: 26px; }
    .ev-section:last-child { margin-bottom: 0; }
    .ev-head { display: flex; align-items: baseline; gap: 11px; margin-bottom: 6px; }
    .ev-title { font-family: var(--display); font-size: 22px; line-height: 1.15; }
    .ev-sum { color: var(--dim); margin-bottom: 16px !important; }
    .ev-mini { margin: 14px 0; }
    .ev-conflict {
      margin-top: 16px; padding: 12px 14px; background: var(--err-dim);
      border: 1px solid var(--err); border-radius: 6px; font-size: 13px;
    }
    .ev-conflict strong { color: var(--err); }
    .ev-empty { color: var(--dim); font-style: italic; font-size: 13px; }

    .mermaid-wrap { display: flex; justify-content: center; overflow: auto; }
    .mermaid svg { max-width: 100%; height: auto; }
    pre.code {
      margin: 0; padding: 14px 16px; background: var(--recessed); border-radius: 6px;
      font-family: var(--mono); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; overflow-x: auto;
    }
    pre.code .hl { background: var(--hi-dim); padding: 1px 3px; border-radius: 2px; }
    pre.code .fn { color: var(--dim); font-size: 11px; display: block; margin-bottom: 8px; }

    /* ── Decision pane ───────────────────────────────────────── */
    h1.q { font-family: var(--display); font-size: 26px; line-height: 1.18; font-weight: 400; margin: 0 0 18px; }
    ol.options { list-style: none; margin: 0; padding: 2px; flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 9px; }
    li.opt-row {
      display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 13px;
      padding: 11px 13px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
      transition: border-color .14s, background .14s; outline: none;
    }
    li.opt-row:hover, li.opt-row.previewing { border-color: var(--border-strong); background: var(--recessed); }
    li.opt-row:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    li.opt-row.chosen { border-color: var(--hi); background: var(--hi-dim); }
    .opt-letter { font-family: var(--mono); font-weight: 600; color: var(--accent); }
    .opt-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .opt-title { font-weight: 600; }
    .opt-rec { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--hi); margin-left: 8px; }
    .opt-summary { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .act { flex: 0 0 auto; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .act textarea {
      width: 100%; min-height: 46px; font: inherit; font-size: 13px; padding: 10px 12px; resize: vertical;
      background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    }
    .act textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .row { display: flex; gap: 9px; margin-top: 9px; }
    .btn {
      font: inherit; font-size: 12px; font-family: var(--mono); padding: 7px 15px; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); transition: background .14s, opacity .14s;
    }
    .btn:hover:not(:disabled) { background: var(--recessed); }
    .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
    .btn:disabled { opacity: .45; cursor: default; }
    .opt-choose { padding: 6px 14px; }

    .working-banner {
      margin-top: 14px; padding: 11px 14px; border-radius: 8px; background: var(--hi-dim);
      border: 1px solid var(--hi); font-family: var(--mono); font-size: 12px; color: var(--text);
      display: flex; align-items: center; gap: 10px;
    }
    .spinner { width: 12px; height: 12px; border: 2px solid var(--hi); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Glossary term reveal (e-reader dictionary style) ────── */
    .term { border-bottom: 1px dotted var(--accent); cursor: help; }
    .term:hover, .term:focus { background: var(--accent-dim); outline: none; border-radius: 2px; }
    .term-popover {
      position: fixed; z-index: 200; max-width: 320px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,.20); padding: 12px 14px; font-size: 13px; line-height: 1.5;
    }
    .term-popover[hidden] { display: none; }
    .tp-term { font-family: var(--mono); font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .tp-avoid { margin-top: 7px; font-size: 11px; color: var(--dim); font-style: italic; }

    .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--dim); font-family: var(--mono); font-size: 13px; text-align: center; }
    .placeholder .big { font-family: var(--display); font-size: 26px; color: var(--text); }

    /* Completion (terminal) state */
    .working-banner.soft { background: var(--recessed); border-color: var(--border); color: var(--dim); }
    .complete { display: flex; flex-direction: column; justify-content: flex-start; gap: 6px; }
    .complete-mark { font-family: var(--mono); font-size: 30px; line-height: 1; color: var(--ok); }
    .complete .q { margin: 6px 0 2px; }
    .complete-sub { margin: 0; color: var(--text); }
    .complete-sub.dim2 { color: var(--dim); font-size: 13px; }
    .recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 13px; }
    .recap li { padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .recap li:last-child { border-bottom: 0; padding-bottom: 0; }
    .recap-q { display: block; color: var(--text); }
    .recap-a { display: block; margin-top: 3px; font-family: var(--mono); font-size: 12px; line-height: 1.5; color: var(--ok); overflow-wrap: anywhere; }
    .recap-a::before { content: "→ "; color: var(--dim); }
    .recap-meta { margin-top: 16px; font-family: var(--mono); font-size: 11px; color: var(--dim); }

    /* ── Responsive: stack to one scrolling column ───────────── */
    @media (max-width: 900px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .panes { grid-template-columns: 1fr; overflow: visible; }
      .evidence { border-right: 0; border-bottom: 1px solid var(--border); overflow: visible; }
      .decision { overflow: visible; }
      ol.options { overflow: visible; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
  <script>
    /* Set the theme before first paint (no flash). Reads the persisted cookie;
       falls back to the OS preference in "auto" mode. */
    (function () {
      try {
        var m = document.cookie.match(/(?:^|;\s*)iptheme=(light|dark|auto)/);
        var pref = m ? m[1] : "auto";
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <span class="tb-slug" id="tb-slug">…</span>
    <span class="tb-q" id="tb-q"></span>
    <div class="stepper" id="stepper"></div>
    <span class="tb-spacer"></span>
    <button class="theme-btn" id="theme-btn" title="Theme: auto / light / dark">auto</button>
    <span class="status" id="status-bar"><span class="dot"></span><span id="status-text">connecting</span></span>
  </header>

  <div class="panes">
    <section class="evidence" id="evidence" aria-label="Context and detail"></section>
    <section class="decision" id="decision" aria-label="Question and options">
      <div class="placeholder">
        <div class="big">Waiting for the first question…</div>
        <div>The agent will write q-01.json; this page updates itself.</div>
      </div>
    </section>
  </div>

  <div class="term-popover" id="term-popover" hidden></div>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

    const POLL_MS = 750;
    const SOFT_MS = 12000;  // after this with no next card, "composing…" softens to "safe to close"
    const state = {
      session: null,
      questions: new Map(),  // id -> q-NN.json
      active: null,          // displayed question id
      pendingQid: null,      // a qid we've answered and are awaiting the agent on
      pendingLabel: "",
      stale: 0,
      mermaidInit: false,
      pinnedOpt: null,       // option index pinned into the evidence pane (click/touch)
      shownOpt: undefined,   // what the evidence pane currently shows (guards re-render)
      mseq: 0,               // monotonic mermaid id counter (avoids id collisions)
    };

    const qFile = id => `./q-${String(id).padStart(2, "0")}.json`;
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const escAttr = s => esc(s).replace(/\n/g, "&#10;");
    const isNarrow = () => window.matchMedia("(max-width: 900px)").matches;

    // Only re-render when these change — the 750ms poll must not rebuild the DOM
    // every tick (drops :hover / focus / pin state and re-runs mermaid).
    const topbarSig = s => JSON.stringify({
      slug: s.slug, active: state.active,
      qs: (s.questions || []).map(q => [q.id, q.title, q.status, q.answer]),
    });
    // Session is complete when the agent says so, or when every question is
    // resolved/parked (the agent writes session.json atomically per wake, so
    // "all resolved" only becomes true at the genuine end, not mid-session).
    const sessionDone = () => {
      const s = state.session; if (!s) return false;
      if (s.status === "complete") return true;
      const qs = s.questions || [];
      return qs.length > 0 && qs.every(q => q.status === "resolved" || q.status === "parked");
    };
    const cardSig = () => JSON.stringify({
      active: state.active, pending: state.pendingQid, has: state.questions.has(state.active), done: sessionDone(),
    });

    function setStatus(kind, msg) {
      const bar = document.getElementById("status-bar");
      bar.className = "status " + kind;
      document.getElementById("status-text").textContent =
        kind === "working" ? "agent working" : kind === "live" ? "live" : kind === "stale" ? `stale · ${msg ?? ""}` : "connecting";
    }

    async function sendIntent(kind, { value = "", note = "", label = "" } = {}) {
      armAlerts();
      const qid = state.active;
      const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
      state.pendingQid = qid;
      state.pendingLabel = label || value || kind;
      await renderActive();
      setStatus("working");
      clearTimeout(state._softTimer);
      const qid0 = qid;
      state._softTimer = setTimeout(() => { if (state.pendingQid === qid0) softenBanner(); }, SOFT_MS);
      try {
        const res = await fetch("/intent", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, qid, kind, value, note }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
      } catch (e) {
        state.pendingQid = null;
        await renderActive();
        setStatus("stale", "post failed");
      }
    }

    async function pollOnce() {
      try {
        const res = await fetch("./session.json", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        state.stale = 0;
        await applySession(await res.json());
      } catch (e) {
        if (++state.stale > 2 && !sessionDone()) setStatus("stale", e.message);
      }
    }

    async function applySession(next) {
      state.session = next;
      const targetId = next.currentQuestion ?? (next.questions || []).slice(-1)[0]?.id ?? null;

      for (const q of next.questions || []) {
        if (!state.questions.has(q.id)) {
          try { const r = await fetch(qFile(q.id), { cache: "no-store" }); if (r.ok) state.questions.set(q.id, await r.json()); } catch {}
        }
      }

      const justResolved = state.pendingQid !== null && targetId !== state.pendingQid;
      if (justResolved) state.pendingQid = null;

      const wasDone = state._wasDone === true;
      const done = sessionDone();
      state._wasDone = done;
      if (done) { state.pendingQid = null; clearTimeout(state._softTimer); }

      if (state.pendingQid === null) setStatus("live");
      if (targetId !== state.active) state.active = targetId;

      if (topbarSig(next) !== state._topbarSig) renderTopbar(next);
      if (cardSig() !== state._cardSig) await renderActive();

      if (done && !wasDone) notifyDone();
      else if (justResolved && !done) notifyReady(targetId);
    }

    function renderTopbar(s) {
      document.getElementById("tb-slug").textContent = s.slug || "session";
      const qs = s.questions || [];
      document.getElementById("tb-q").textContent = state.active ? `Question ${state.active} of ${qs.length || "?"}` : "";
      const stepper = document.getElementById("stepper");
      stepper.innerHTML = "";
      qs.forEach(q => {
        const b = document.createElement("button");
        b.className = "step " + (q.id === state.active ? "current" : (q.status || "pending"));
        b.title = `Q${q.id}: ${q.title || ""}` + (q.status === "resolved" ? ` → ${q.answer ?? ""}` : q.status === "parked" ? " (parked)" : "");
        b.setAttribute("aria-label", b.title);
        b.onclick = () => { state.active = q.id; renderActive(); renderTopbar(s); };
        stepper.appendChild(b);
      });
      state._topbarSig = topbarSig(s);
    }

    // Visual content only (no chrome) — caller wraps. Used in both panes.
    function renderVisual(v, idBase) {
      if (!v) return "";
      if (v.type === "mermaid")
        return `<div class="mermaid-wrap"><div class="mermaid" data-mid="${idBase}" data-source="${escAttr(v.source || "")}">…</div></div>`;
      if (v.type === "code") {
        let body = esc(v.source || "");
        for (const h of (v.highlights || [])) {
          const e = esc(h).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          body = body.replace(new RegExp(e, "g"), m => `<span class="hl">${m}</span>`);
        }
        return `<pre class="code">${v.filename ? `<span class="fn">${esc(v.filename)}</span>` : ""}${body}</pre>`;
      }
      return "";
    }

    async function renderMermaidIn(root) {
      const nodes = root.querySelectorAll(".mermaid");
      if (!nodes.length) return;
      if (!state.mermaidInit) {
        mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base", themeVariables: mermaidVars() });
        state.mermaidInit = true;
      }
      for (const n of nodes) {
        try { const { svg } = await mermaid.render(n.dataset.mid, n.dataset.source); n.innerHTML = svg; }
        catch (e) { n.innerHTML = `<pre class="code">Mermaid error: ${esc(String(e.message || e))}</pre>`; }
      }
    }

    // Left pane. i = option index to detail, or null for the question's context+visual.
    function showEvidence(i) {
      if (i === state.shownOpt) return;
      state.shownOpt = i;
      const ev = document.getElementById("evidence");
      const q = state.active != null ? state.questions.get(state.active) : null;
      if (!q) { ev.innerHTML = ""; return; }
      document.querySelectorAll(".opt-row").forEach(r => r.classList.toggle("previewing", +r.dataset.i === i));

      let html = "";
      if (i == null) {
        if ((q.context?.paragraphs || []).length)
          html += `<div class="ev-section"><div class="lbl">Context</div>${q.context.paragraphs.map(p => `<p>${p}</p>`).join("")}</div>`;
        if (q.visual) html += `<div class="ev-section"><div class="lbl">Visual</div>${renderVisual(q.visual, `viz-${q.id}-${state.mseq++}`)}</div>`;
        if (!html) html = `<div class="ev-empty">No context for this question. Pick an option on the right.</div>`;
      } else {
        const o = (q.options || [])[i] || {};
        const letter = o.letter || String.fromCharCode(65 + i);
        html += `<div class="ev-head"><span class="opt-letter">${esc(letter)}</span><span class="ev-title">${esc(o.title || "")}${o.recommended ? `<span class="opt-rec">recommended</span>` : ""}</span></div>`;
        if (o.summary) html += `<p class="ev-sum">${esc(o.summary)}</p>`;
        if (o.detail) html += `<div class="ev-section"><div class="lbl">Detail</div><p>${o.detail}</p></div>`;
        if (o.miniVisual) html += `<div class="ev-section ev-mini">${renderVisual(o.miniVisual, `viz-${q.id}-o${i}-${state.mseq++}`)}</div>`;
        if (o.recommended && o.rationale) html += `<div class="ev-section"><div class="lbl">Why recommended</div><p>${o.rationale}</p></div>`;
        if (o.downstream) html += `<div class="ev-section"><div class="lbl">Downstream</div><p>${o.downstream}</p></div>`;
        if (o.conflict) html += `<div class="ev-conflict"><strong>Conflict:</strong> ${o.conflict}</div>`;
        if (!o.detail && !o.miniVisual && !o.rationale && !o.downstream && !o.conflict)
          html += `<div class="ev-empty">No extra detail. Click “Choose ${esc(letter)}” to pick it.</div>`;
      }
      ev.innerHTML = html;
      linkGlossary(ev);
      renderMermaidIn(ev);
    }

    async function renderActive() {
      const dec = document.getElementById("decision");
      const ev = document.getElementById("evidence");
      state.pinnedOpt = null;
      state.shownOpt = undefined;
      if (sessionDone()) { renderComplete(dec, ev); state._cardSig = cardSig(); return; }
      if (state.active == null || !state.questions.has(state.active)) {
        ev.innerHTML = "";
        dec.innerHTML = `<div class="placeholder"><div class="big">Waiting for question…</div><div>The agent will write the next card.</div></div>`;
        state._cardSig = cardSig();
        return;
      }
      const q = state.questions.get(state.active);
      const working = state.pendingQid === q.id;

      const opts = (q.options || []).map((o, i) => {
        const letter = o.letter || String.fromCharCode(65 + i);
        const chosen = working && state.pendingLabel === letter;
        return `<li class="opt-row ${chosen ? "chosen" : ""}" data-i="${i}" data-letter="${esc(letter)}" tabindex="0">
            <span class="opt-letter">${esc(letter)}</span>
            <span class="opt-main">
              <span class="opt-title">${esc(o.title || "")}${o.recommended ? `<span class="opt-rec">rec</span>` : ""}</span>
              ${o.summary ? `<span class="opt-summary">${esc(o.summary)}</span>` : ""}
            </span>
            <button class="btn primary opt-choose" data-letter="${esc(letter)}" ${working ? "disabled" : ""}>Choose</button>
          </li>`;
      }).join("");

      dec.innerHTML = `
        <h1 class="q">${esc(q.question || "")}</h1>
        <ol class="options" role="listbox" aria-label="Answer options">${opts || '<li class="ev-empty">No options.</li>'}</ol>
        <div class="act">
          <textarea id="ff" placeholder="…or type your own answer" ${working ? "disabled" : ""}></textarea>
          <div class="row">
            <button class="btn primary" id="ff-send" ${working ? "disabled" : ""}>Send</button>
            <button class="btn" id="skip-btn" ${working ? "disabled" : ""}>Skip</button>
          </div>
          ${working ? `<div class="working-banner"><span class="spinner"></span>Sent <strong>${esc(state.pendingLabel)}</strong>, composing the next question…</div>` : ""}
        </div>`;

      // Rows preview their detail in the Evidence pane; Choose commits (explicit,
      // so reading detail never submits). Hover = transient, click = pin (touch/keyboard).
      dec.querySelectorAll(".opt-row").forEach(row => {
        const i = +row.dataset.i;
        row.addEventListener("mouseenter", () => showEvidence(i));
        row.addEventListener("mouseleave", () => showEvidence(state.pinnedOpt));
        row.addEventListener("focus", () => showEvidence(i));
        row.addEventListener("click", e => {
          if (e.target.closest(".opt-choose")) return;
          state.pinnedOpt = (state.pinnedOpt === i) ? null : i;
          showEvidence(state.pinnedOpt === null ? i : i);
          if (isNarrow()) ev.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
      dec.querySelectorAll(".opt-choose").forEach(btn => {
        btn.onclick = e => { e.stopPropagation(); sendIntent("answer", { value: btn.dataset.letter, label: btn.dataset.letter }); };
      });
      const ff = dec.querySelector("#ff-send");
      if (ff) ff.onclick = () => { const t = dec.querySelector("#ff").value.trim(); if (t) sendIntent("freeform", { value: t, label: "your answer" }); };
      const sk = dec.querySelector("#skip-btn");
      if (sk) sk.onclick = () => sendIntent("skip", { label: "skip" });

      linkGlossary(dec);          // question + option summaries
      showEvidence(null);         // default evidence: context + visual
      state._cardSig = cardSig();
    }

    function mermaidVars() {
      const cs = getComputedStyle(document.documentElement);
      const g = k => cs.getPropertyValue(k).trim();
      return { background: g("--surface"), primaryColor: g("--surface"), primaryTextColor: g("--text"),
        primaryBorderColor: g("--accent"), lineColor: g("--dim"), fontFamily: g("--body"), fontSize: "15px" };
    }

    // Terminal state — replaces the card so the viewer never sits on a stuck
    // "Sent your answer" spinner once the session is over.
    function renderComplete(dec, ev) {
      const s = state.session || {};
      const qs = s.questions || [];
      const resolved = qs.filter(q => q.status === "resolved").length;
      const parked = qs.filter(q => q.status === "parked").length;
      const docs = (s.glossary && s.glossary.length) || (s.adrs && s.adrs.length);
      dec.innerHTML = `
        <div class="complete">
          <div class="complete-mark">✓</div>
          <h1 class="q">Planning complete</h1>
          <p class="complete-sub">${resolved} decision${resolved === 1 ? "" : "s"} recorded${parked ? `, ${parked} parked` : ""}.${docs ? " CONTEXT.md and ADRs updated." : ""}</p>
          <p class="complete-sub dim2">You can close this tab.</p>
        </div>`;
      let recap = `<div class="lbl">Decisions</div><ol class="recap">`;
      qs.forEach(q => {
        const ans = q.status === "resolved" ? esc(q.answer ?? "resolved") : q.status === "parked" ? "parked" : "—";
        recap += `<li><span class="recap-q">${esc(q.title || ("Q" + q.id))}</span><span class="recap-a">${ans}</span></li>`;
      });
      recap += `</ol>`;
      const meta = [];
      if (s.glossary && s.glossary.length) meta.push(`${s.glossary.length} glossary term${s.glossary.length === 1 ? "" : "s"}`);
      if (s.adrs && s.adrs.length) meta.push(`${s.adrs.length} ADR${s.adrs.length === 1 ? "" : "s"}`);
      if (meta.length) recap += `<div class="recap-meta">${meta.join(" · ")}</div>`;
      ev.innerHTML = recap;
      linkGlossary(ev);
    }

    // Last-resort fallback: if the agent goes quiet after an answer (no next card,
    // no completion signal), soften the spinner so it never reads as a hang.
    function softenBanner() {
      const b = document.querySelector(".working-banner");
      if (b) { b.classList.add("soft"); b.innerHTML = "Answer sent. The agent may be wrapping up; you can close this tab when the session is done."; }
    }

    function notifyDone() {
      if (!document.hidden) return;
      startTitleFlash("● Planning complete");
      if (window.Notification && Notification.permission === "granted") {
        try { new Notification("interactive-plan", { body: "Planning complete." }); } catch {}
      }
      beep();
    }

    // ── Readiness alerts ──────────────────────────────────────────────
    const BASE_TITLE = "interactive-plan";
    let _titleTimer = null;
    function startTitleFlash(msg) {
      stopTitleFlash();
      let on = true; document.title = msg;
      _titleTimer = setInterval(() => { document.title = (on = !on) ? msg : BASE_TITLE; }, 1000);
    }
    function stopTitleFlash() { if (_titleTimer) { clearInterval(_titleTimer); _titleTimer = null; } document.title = BASE_TITLE; }
    function beep() {
      try {
        if (!state._actx) return;
        const o = state._actx.createOscillator(), g = state._actx.createGain();
        o.frequency.value = 660; g.gain.value = 0.04;
        o.connect(g); g.connect(state._actx.destination);
        o.start(); o.stop(state._actx.currentTime + 0.12);
      } catch {}
    }
    function notifyReady(id) {
      if (!document.hidden) return;
      const label = `Q${id}`;
      startTitleFlash(`● ${label} ready`);
      if (window.Notification && Notification.permission === "granted") {
        try { new Notification("interactive-plan", { body: `${label} is ready, your answer is in.` }); } catch {}
      }
      beep();
    }
    function armAlerts() {
      if (window.Notification && Notification.permission === "default" && !state._notifyAsked) {
        state._notifyAsked = true;
        try { Notification.requestPermission(); } catch {}
      }
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx && !state._actx) state._actx = new Ctx();
        if (state._actx && state._actx.state === "suspended") state._actx.resume();
      } catch {}
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) stopTitleFlash(); });

    // ── Glossary term reveal ──────────────────────────────────────────
    const TERM_SKIP = new Set(["PRE", "CODE", "BUTTON", "TEXTAREA", "SCRIPT", "STYLE"]);
    function linkGlossary(root) {
      const gloss = (state.session && state.session.glossary) || [];
      if (!gloss.length) return;
      const lookup = new Map(gloss.filter(g => g.term).map(g => [g.term.toLowerCase(), g]));
      const escaped = gloss.map(g => g.term).filter(Boolean)
        .sort((a, b) => b.length - a.length)
        .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      const re = new RegExp(`\\b(${escaped.join("|")})\\b`, "gi");
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(n) {
          if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          for (let p = n.parentElement; p && p !== root; p = p.parentElement) {
            if (TERM_SKIP.has(p.tagName) || p.classList.contains("mermaid") || p.classList.contains("term") || p.classList.contains("opt-summary"))
              return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        },
      });
      const targets = [];
      for (let n = walker.nextNode(); n; n = walker.nextNode()) targets.push(n);
      for (const tn of targets) {
        const text = tn.nodeValue;
        re.lastIndex = 0;
        if (!re.test(text)) continue;
        re.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let last = 0, m;
        while ((m = re.exec(text))) {
          const g = lookup.get(m[0].toLowerCase());
          if (!g) continue;
          if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
          const span = document.createElement("span");
          span.className = "term"; span.tabIndex = 0; span.dataset.term = g.term; span.textContent = m[0];
          frag.appendChild(span);
          last = m.index + m[0].length;
        }
        if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
        tn.parentNode.replaceChild(frag, tn);
      }
      root.querySelectorAll(".term").forEach(t => {
        t.onclick = e => { e.stopPropagation(); showTermPopover(t); };
        t.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showTermPopover(t); } };
      });
    }
    function showTermPopover(el) {
      const g = (state.session && state.session.glossary || []).find(x => x.term === el.dataset.term);
      if (!g) return;
      const pop = document.getElementById("term-popover");
      pop.innerHTML = `<div class="tp-term">${esc(g.term)}</div><div>${esc(g.definition || "")}</div>`
        + (g.avoid && g.avoid.length ? `<div class="tp-avoid">Avoid: ${esc(g.avoid.join(", "))}</div>` : "");
      pop.hidden = false;
      pop.style.visibility = "hidden"; pop.style.left = "0px"; pop.style.top = "0px";
      const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
      const left = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8);
      let top = r.bottom + 6;
      if (top + ph > window.innerHeight - 8) top = r.top - ph - 6;
      pop.style.left = left + "px"; pop.style.top = Math.max(8, top) + "px"; pop.style.visibility = "visible";
      state._popoverOpen = true;
    }
    function hideTermPopover() {
      const pop = document.getElementById("term-popover");
      if (!pop.hidden) { pop.hidden = true; state._popoverOpen = false; }
    }
    document.addEventListener("click", e => {
      if (state._popoverOpen && !e.target.closest("#term-popover") && !e.target.classList.contains("term")) hideTermPopover();
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") hideTermPopover(); });
    window.addEventListener("scroll", () => hideTermPopover(), true);

    // ── Theme toggle ──────────────────────────────────────────────────
    // Cycles auto → light → dark. The choice lives in memory (source of truth)
    // and is mirrored to a cookie for persistence — cookies are shared across
    // the per-session ports, unlike localStorage. "auto" follows the OS. We
    // read the cookie only once at load; reading it back right after a write
    // doesn't reflect synchronously, which would lag the toggle by one click.
    const THEME_ORDER = ["auto", "light", "dark"];
    const _tm = document.cookie.match(/(?:^|;\s*)iptheme=(light|dark|auto)/);
    state.themePref = _tm ? _tm[1] : "auto";
    function applyTheme() {
      const pref = state.themePref;
      const dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      const btn = document.getElementById("theme-btn");
      if (btn) btn.textContent = pref;
    }
    function retheme() { state.mermaidInit = false; applyTheme(); renderActive(); }  // re-render so mermaid recolors
    document.getElementById("theme-btn").onclick = () => {
      state.themePref = THEME_ORDER[(THEME_ORDER.indexOf(state.themePref) + 1) % THEME_ORDER.length];
      document.cookie = "iptheme=" + state.themePref + ";path=/;max-age=31536000;samesite=lax";
      retheme();
    };
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.themePref === "auto") retheme(); });
    applyTheme();

    setStatus("connecting");
    pollOnce();
    setInterval(pollOnce, POLL_MS);
  </script>
</body>
</html>
