<!doctype html>
<!--
  viewer.html — single-page session viewer for visual-grill-with-docs.

  This file is copied verbatim into each session folder by `scripts/session.sh`.
  It polls `./session.json` and lazily fetches `./q-NN.json` files. The agent
  writes JSON; this viewer renders. No build step, no framework.

  Five baked-in aesthetics: editorial, blueprint, paper-ink, monochrome, ide-nord.
  Set in session.json `aesthetic` field. Default: editorial.
-->
<html lang="en" data-theme="editorial">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>visual-grill-with-docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&family=Fragment+Mono&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ─── Theme: editorial (default) ─────────────────────────────── */
    :root, :root[data-theme="editorial"] {
      --bg: #faf7f5;
      --surface: #ffffff;
      --surface-recessed: #f3efe9;
      --border: rgba(30, 58, 95, 0.14);
      --border-strong: rgba(30, 58, 95, 0.28);
      --text: #1a1d24;
      --text-dim: #5c6573;
      --accent: #1e3a5f;
      --accent-dim: rgba(30, 58, 95, 0.08);
      --hi: #d4a73a;
      --hi-dim: rgba(212, 167, 58, 0.12);
      --conflict: #b3261e;
      --conflict-dim: rgba(179, 38, 30, 0.08);
      --font-display: "Instrument Serif", Georgia, serif;
      --font-body: "IBM Plex Sans", -apple-system, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
      --bg-pattern: linear-gradient(var(--border) 1px, transparent 1px),
                    linear-gradient(90deg, var(--border) 1px, transparent 1px);
      --bg-pattern-size: 48px 48px;
    }
    /* ─── Theme: blueprint ───────────────────────────────────────── */
    :root[data-theme="blueprint"] {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-recessed: #e2e8f0;
      --border: rgba(15, 23, 42, 0.12);
      --border-strong: rgba(15, 23, 42, 0.3);
      --text: #0f172a;
      --text-dim: #475569;
      --accent: #1e293b;
      --accent-dim: rgba(30, 41, 59, 0.08);
      --hi: #0891b2;
      --hi-dim: rgba(8, 145, 178, 0.12);
      --conflict: #b91c1c;
      --conflict-dim: rgba(185, 28, 28, 0.08);
      --font-display: "IBM Plex Sans", -apple-system, sans-serif;
      --font-body: "IBM Plex Sans", -apple-system, system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --bg-pattern: linear-gradient(var(--border) 1px, transparent 1px),
                    linear-gradient(90deg, var(--border) 1px, transparent 1px);
      --bg-pattern-size: 32px 32px;
    }
    /* ─── Theme: paper-ink ───────────────────────────────────────── */
    :root[data-theme="paper-ink"] {
      --bg: #faf6f0;
      --surface: #fefcf8;
      --surface-recessed: #f0e9dd;
      --border: rgba(120, 53, 15, 0.16);
      --border-strong: rgba(120, 53, 15, 0.32);
      --text: #1c1917;
      --text-dim: #78716c;
      --accent: #c2410c;
      --accent-dim: rgba(194, 65, 12, 0.1);
      --hi: #65a30d;
      --hi-dim: rgba(101, 163, 13, 0.12);
      --conflict: #9f1239;
      --conflict-dim: rgba(159, 18, 57, 0.08);
      --font-display: "Bricolage Grotesque", Georgia, serif;
      --font-body: "Bricolage Grotesque", -apple-system, sans-serif;
      --font-mono: "Fragment Mono", ui-monospace, monospace;
      --bg-pattern: radial-gradient(circle at 20% 10%, var(--hi-dim) 0, transparent 40%),
                    radial-gradient(circle at 80% 80%, var(--accent-dim) 0, transparent 40%);
      --bg-pattern-size: auto;
    }
    /* ─── Theme: monochrome (dark only) ──────────────────────────── */
    :root[data-theme="monochrome"] {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-recessed: #1c1c1c;
      --border: rgba(245, 158, 11, 0.16);
      --border-strong: rgba(245, 158, 11, 0.4);
      --text: #f5e6c8;
      --text-dim: #a88c5f;
      --accent: #f59e0b;
      --accent-dim: rgba(245, 158, 11, 0.08);
      --hi: #fbbf24;
      --hi-dim: rgba(251, 191, 36, 0.12);
      --conflict: #ef4444;
      --conflict-dim: rgba(239, 68, 68, 0.1);
      --font-display: "JetBrains Mono", ui-monospace, monospace;
      --font-body: "JetBrains Mono", ui-monospace, monospace;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --bg-pattern: linear-gradient(rgba(245, 158, 11, 0.04) 1px, transparent 1px);
      --bg-pattern-size: 100% 3px;
    }
    /* ─── Theme: ide-nord ────────────────────────────────────────── */
    :root[data-theme="ide-nord"] {
      --bg: #eceff4;
      --surface: #ffffff;
      --surface-recessed: #e5e9f0;
      --border: rgba(46, 52, 64, 0.14);
      --border-strong: rgba(46, 52, 64, 0.3);
      --text: #2e3440;
      --text-dim: #4c566a;
      --accent: #5e81ac;
      --accent-dim: rgba(94, 129, 172, 0.1);
      --hi: #88c0d0;
      --hi-dim: rgba(136, 192, 208, 0.18);
      --conflict: #bf616a;
      --conflict-dim: rgba(191, 97, 106, 0.1);
      --font-display: "DM Sans", -apple-system, sans-serif;
      --font-body: "DM Sans", -apple-system, system-ui, sans-serif;
      --font-mono: "Fira Code", ui-monospace, monospace;
      --bg-pattern: none;
      --bg-pattern-size: auto;
    }

    /* ─── Dark-mode overrides per theme ──────────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root, :root[data-theme="editorial"] {
        --bg: #14181f;
        --surface: #1c2129;
        --surface-recessed: #161b22;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.18);
        --text: #ebe7df;
        --text-dim: #8a8d96;
        --accent: #7ba8d9;
        --accent-dim: rgba(123, 168, 217, 0.12);
        --hi: #e6c065;
        --hi-dim: rgba(230, 192, 101, 0.15);
        --conflict: #f08a82;
        --conflict-dim: rgba(240, 138, 130, 0.12);
      }
      :root[data-theme="blueprint"] {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-recessed: #0f1729;
        --border: rgba(148, 163, 184, 0.12);
        --border-strong: rgba(148, 163, 184, 0.3);
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --accent: #93c5fd;
        --accent-dim: rgba(147, 197, 253, 0.1);
        --hi: #67e8f9;
        --hi-dim: rgba(103, 232, 249, 0.12);
      }
      :root[data-theme="paper-ink"] {
        --bg: #1c1917;
        --surface: #292524;
        --surface-recessed: #1a1715;
        --border: rgba(214, 211, 209, 0.1);
        --border-strong: rgba(214, 211, 209, 0.25);
        --text: #f5e6d3;
        --text-dim: #a8a29e;
        --accent: #fb923c;
        --accent-dim: rgba(251, 146, 60, 0.1);
        --hi: #a3e635;
        --hi-dim: rgba(163, 230, 53, 0.12);
      }
      :root[data-theme="ide-nord"] {
        --bg: #2e3440;
        --surface: #3b4252;
        --surface-recessed: #2a303c;
        --border: rgba(216, 222, 233, 0.1);
        --border-strong: rgba(216, 222, 233, 0.28);
        --text: #eceff4;
        --text-dim: #d8dee9;
        --accent: #88c0d0;
        --accent-dim: rgba(136, 192, 208, 0.12);
        --hi: #a3be8c;
        --hi-dim: rgba(163, 190, 140, 0.15);
        --conflict: #bf616a;
      }
    }

    /* ─── Base layout ─────────────────────────────────────────────── */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--text);
      line-height: 1.6;
      background: var(--bg);
      background-image: var(--bg-pattern);
      background-size: var(--bg-pattern-size);
      background-position: -1px -1px;
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      #sidebar { display: none; }
    }

    /* ─── Sidebar (TOC) ──────────────────────────────────────────── */
    #sidebar {
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 24px 18px;
      overflow-y: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }
    #sidebar h2 {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin: 18px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    #sidebar h2:first-of-type { margin-top: 0; }
    .session-title {
      font-family: var(--font-display);
      font-size: 22px;
      line-height: 1.1;
      margin: 0 0 6px;
      color: var(--text);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .session-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .session-meta span { display: block; }
    .aesthetic-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 2px 7px;
      border-radius: 3px;
      margin-top: 4px;
    }

    ol.toc { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    ol.toc li {
      padding: 8px 10px;
      border-radius: 3px;
      cursor: pointer;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: baseline;
      font-size: 13px;
      color: var(--text);
      border: 1px solid transparent;
      transition: background 120ms ease, border-color 120ms ease;
    }
    ol.toc li:hover { background: var(--surface-recessed); }
    ol.toc li.active {
      background: var(--accent-dim);
      border-color: var(--accent);
    }
    ol.toc li .q-num {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
    }
    ol.toc li .status {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      grid-column: 2;
      margin-top: 2px;
    }
    ol.toc li.resolved .status { color: var(--hi); }
    ol.toc li.parked .status { color: var(--text-dim); font-style: italic; }
    ol.toc li.pending .status { color: var(--accent); }

    dl.glossary { margin: 0; display: flex; flex-direction: column; gap: 8px; }
    dl.glossary dt {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      margin: 0;
    }
    dl.glossary dd { margin: 0; font-size: 12px; color: var(--text); }
    dl.glossary dd em { color: var(--text-dim); font-style: italic; font-size: 11px; display: block; margin-top: 2px; }

    ul.adrs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    ul.adrs li {
      font-size: 12px;
      padding: 6px 8px;
      background: var(--hi-dim);
      border-left: 2px solid var(--hi);
      border-radius: 2px;
    }
    ul.adrs li code { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }

    .empty { font-style: italic; color: var(--text-dim); font-size: 12px; }

    /* ─── Main column ────────────────────────────────────────────── */
    main { padding: 36px 32px 96px; max-width: 880px; }
    @media (max-width: 700px) { main { padding: 24px 16px 64px; } }

    /* status bar (server/poll indicator) */
    .status-bar {
      position: fixed;
      top: 12px;
      right: 14px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      z-index: 100;
    }
    .status-bar .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-dim);
      transition: background 160ms ease;
    }
    .status-bar.live .dot { background: var(--hi); }
    .status-bar.stale .dot { background: var(--conflict); }

    /* 1. Header strip */
    .qheader {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .qheader__qnum {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      padding: 3px 10px;
      background: var(--accent-dim);
      border-radius: 3px;
    }
    .qheader__pills { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
    .pill {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-recessed);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: default;
    }

    /* 2. Context band */
    .context {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 18px 22px;
      margin-bottom: 32px;
      border-radius: 2px;
    }
    .context__label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .context p { margin: 0 0 10px; color: var(--text); }
    .context p:last-child { margin-bottom: 0; }
    .context strong { font-weight: 600; border-bottom: 1px dotted var(--hi); }
    .context blockquote {
      margin: 12px 0;
      padding: 8px 14px;
      border-left: 2px solid var(--hi);
      background: var(--hi-dim);
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
    }
    .context__update {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
    }
    .context__update::before { content: "↳ "; color: var(--hi); font-style: normal; }

    /* 3. Visual */
    .visual {
      margin: 0 0 36px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    .visual__label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 14px;
    }
    .mermaid-wrap { display: flex; justify-content: center; overflow: auto; }
    .mermaid svg { max-width: 100%; height: auto; }
    pre.code {
      margin: 0;
      padding: 14px 16px;
      background: var(--surface-recessed);
      border-radius: 2px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-x: auto;
      color: var(--text);
    }
    pre.code .hl { background: var(--hi-dim); padding: 1px 3px; border-radius: 2px; }
    pre.code .filename { color: var(--text-dim); font-size: 11px; display: block; margin-bottom: 8px; }
    .two-worlds { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .two-worlds { grid-template-columns: 1fr; } }
    .world { padding: 16px; background: var(--surface-recessed); border-radius: 2px; }
    .world h4 {
      font-family: var(--font-mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0 0 10px;
      color: var(--text-dim);
    }

    /* 4. Question */
    h1.question {
      font-family: var(--font-display);
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 0 0 28px;
      font-weight: 400;
    }

    /* 5. Options accordion */
    .options { display: flex; flex-direction: column; gap: 14px; }
    .option {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      transition: border-color 160ms ease;
    }
    .option:hover, .option.pinned { border-color: var(--border-strong); }
    .option__head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: baseline;
      gap: 14px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
    }
    .option__letter { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--accent); }
    .option__title { font-weight: 600; color: var(--text); }
    .option__summary { grid-column: 2; font-size: 14px; color: var(--text-dim); margin-top: 4px; }
    .option__rec {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--hi);
      background: var(--hi-dim);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .option__body {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      padding: 0 20px;
      transition: max-height 260ms ease, opacity 200ms ease, padding 200ms ease;
    }
    .option:hover .option__body, .option.pinned .option__body {
      max-height: 3000px;
      opacity: 1;
      padding: 4px 20px 22px;
    }
    .option__body h5 {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin: 16px 0 6px;
    }
    .option__body p, .option__body li { margin: 0 0 10px; }
    .option__body code { font-family: var(--font-mono); font-size: 90%; }
    .option__mini { margin: 10px 0; padding: 12px; background: var(--surface-recessed); border-radius: 2px; }
    .option__conflict {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--conflict-dim);
      border-left: 2px solid var(--conflict);
      font-size: 13px;
      color: var(--text);
    }
    .option__conflict strong { color: var(--conflict); }

    .option--open .option__body { max-height: none; opacity: 1; padding: 4px 20px 22px; }
    .option--open .option__head { cursor: default; }

    /* 7. Footer */
    .qfooter {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
    }
    .qfooter kbd {
      font-family: var(--font-mono);
      background: var(--surface-recessed);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
    }

    /* Empty / loading state */
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      flex-direction: column;
      gap: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .placeholder .big { font-family: var(--font-display); font-size: 28px; color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h1 class="session-title" id="session-title">…</h1>
    <div class="session-meta">
      <span id="session-started"></span>
      <span id="session-context"></span>
    </div>
    <span class="aesthetic-tag" id="session-aesthetic"></span>

    <h2>Questions</h2>
    <ol class="toc" id="toc"></ol>

    <h2>Glossary delta</h2>
    <dl class="glossary" id="glossary"></dl>

    <h2>ADRs</h2>
    <ul class="adrs" id="adrs"></ul>
  </aside>

  <main id="page">
    <div class="placeholder" id="placeholder">
      <div class="big">Waiting for first question…</div>
      <div>The agent will write q-01.json to this folder; the page refreshes automatically.</div>
    </div>
  </main>

  <div class="status-bar" id="status-bar"><span class="dot"></span><span id="status-text">connecting</span></div>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

    // ─── State ─────────────────────────────────────────────────────
    const state = {
      session: null,        // parsed session.json
      questions: new Map(), // id (number) -> parsed q-NN.json
      active: null,         // currently displayed question id
      etag: null,           // last session.json etag for cheap polling
      stale: 0,             // consecutive failed fetches
    };

    const POLL_MS = 750;

    // ─── Fetch helpers ─────────────────────────────────────────────
    async function fetchJSON(url, opts = {}) {
      const res = await fetch(url, { cache: "no-store", ...opts });
      if (!res.ok) throw new Error(`${url} → HTTP ${res.status}`);
      return { data: await res.json(), etag: res.headers.get("etag") };
    }

    function qFile(id) {
      return `./q-${String(id).padStart(2, "0")}.json`;
    }

    // ─── Polling loop ──────────────────────────────────────────────
    async function pollOnce() {
      try {
        const headers = state.etag ? { "If-None-Match": state.etag } : {};
        const res = await fetch("./session.json", { cache: "no-store", headers });
        setStatus("live");
        state.stale = 0;
        if (res.status === 304) return;
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        state.etag = res.headers.get("etag");
        const next = await res.json();
        await applySession(next);
      } catch (err) {
        state.stale++;
        if (state.stale > 2) setStatus("stale", err.message);
      }
    }

    async function applySession(next) {
      const prev = state.session;
      state.session = next;
      applyTheme(next.aesthetic || "editorial");
      renderSidebar(next);

      // Decide which question to show.
      // Priority: server-pinned `currentQuestion`, else highest existing q-NN.json id.
      const targetId = next.currentQuestion ?? (next.questions || []).slice(-1)[0]?.id ?? null;

      // Eagerly fetch any newly-listed question files we don't have.
      const needed = (next.questions || []).map(q => q.id).filter(id => !state.questions.has(id));
      for (const id of needed) {
        try {
          const { data } = await fetchJSON(qFile(id));
          state.questions.set(id, data);
        } catch (e) {
          // file may not exist yet (race); ignore
        }
      }

      // If the active question changed OR its data refreshed, re-render.
      const shouldRender = targetId !== state.active || (targetId && needed.includes(targetId));
      if (targetId !== state.active) state.active = targetId;
      if (shouldRender || !prev) await renderActive();
    }

    // ─── Theme ─────────────────────────────────────────────────────
    const VALID_THEMES = new Set(["editorial", "blueprint", "paper-ink", "monochrome", "ide-nord"]);
    function applyTheme(name) {
      const theme = VALID_THEMES.has(name) ? name : "editorial";
      document.documentElement.setAttribute("data-theme", theme);
    }

    // ─── Status bar ────────────────────────────────────────────────
    function setStatus(kind, msg) {
      const bar = document.getElementById("status-bar");
      bar.classList.remove("live", "stale");
      bar.classList.add(kind);
      document.getElementById("status-text").textContent =
        kind === "live" ? "live" :
        kind === "stale" ? `stale · ${msg ?? ""}` :
        "connecting";
    }

    // ─── Sidebar render ────────────────────────────────────────────
    function renderSidebar(s) {
      document.getElementById("session-title").textContent = s.slug || "session";
      document.getElementById("session-started").textContent = s.startedAt ? `started ${s.startedAt}` : "";
      document.getElementById("session-context").textContent = s.contextPath ? `context: ${s.contextPath}` : "";
      document.getElementById("session-aesthetic").textContent = (s.aesthetic || "editorial").replace("-", " ");

      const toc = document.getElementById("toc");
      toc.innerHTML = "";
      (s.questions || []).forEach(q => {
        const li = document.createElement("li");
        li.className = q.status || "pending";
        if (q.id === state.active) li.classList.add("active");
        const num = document.createElement("span"); num.className = "q-num"; num.textContent = `Q${q.id}`;
        const title = document.createElement("span"); title.textContent = q.title || "(no title yet)";
        const status = document.createElement("span"); status.className = "status";
        status.textContent = q.status === "resolved" ? `→ ${q.answer ?? "resolved"}` :
                             q.status === "parked" ? "parked" : "pending";
        li.append(num, title, status);
        li.addEventListener("click", () => {
          state.active = q.id;
          renderActive();
          renderSidebar(state.session); // refresh active highlight
        });
        toc.appendChild(li);
      });

      const gl = document.getElementById("glossary");
      gl.innerHTML = "";
      (s.glossary || []).forEach(g => {
        const dt = document.createElement("dt"); dt.id = g.term.toLowerCase(); dt.textContent = g.term;
        const dd = document.createElement("dd");
        dd.textContent = g.definition;
        if (g.avoid?.length) {
          const em = document.createElement("em");
          em.textContent = `Avoid: ${g.avoid.join(", ")}`;
          dd.appendChild(em);
        }
        gl.append(dt, dd);
      });
      if (!(s.glossary || []).length) {
        gl.innerHTML = '<p class="empty">No terms resolved yet.</p>';
      }

      const adrs = document.getElementById("adrs");
      adrs.innerHTML = "";
      (s.adrs || []).forEach(a => {
        const li = document.createElement("li");
        li.innerHTML = `<code>${escapeHtml(a.id)}</code> — ${escapeHtml(a.title || "")} <em>(${escapeHtml(a.status || "proposed")})</em>`;
        adrs.appendChild(li);
      });
      if (!(s.adrs || []).length) {
        adrs.innerHTML = '<p class="empty">No ADRs proposed yet — the bar is high.</p>';
      }
    }

    // ─── Question render ───────────────────────────────────────────
    let mermaidInitialized = false;
    async function renderActive() {
      const main = document.getElementById("page");
      if (state.active == null || !state.questions.has(state.active)) {
        main.innerHTML = `
          <div class="placeholder">
            <div class="big">Waiting for question…</div>
            <div>The agent will write q-${String((state.active ?? 1)).padStart(2,"0")}.json to this folder.</div>
          </div>`;
        return;
      }
      const q = state.questions.get(state.active);
      const total = state.session?.questions?.length || "?";
      main.innerHTML = `
        <header class="qheader">
          <span class="qheader__qnum">Question ${q.id} of ${total}</span>
          <nav class="qheader__pills" aria-label="Resolved terms">
            ${(q.resolvedPills || []).map(t => `<span class="pill">${escapeHtml(t)}</span>`).join("")}
          </nav>
        </header>

        <section class="context">
          <div class="context__label">Context</div>
          ${(q.context?.paragraphs || []).map(p => `<p>${p}</p>`).join("")}
          ${q.context?.quote ? `<blockquote><strong>${escapeHtml(q.context.quote.term)}:</strong> ${escapeHtml(q.context.quote.definition)}</blockquote>` : ""}
          ${q.context?.lastUpdate ? `<div class="context__update">Glossary updated last turn: ${q.context.lastUpdate}</div>` : ""}
        </section>

        <section class="visual">
          <div class="visual__label">Visual</div>
          ${renderVisual(q.visual, `viz-${q.id}`)}
        </section>

        <h1 class="question">${escapeHtml(q.question || "")}</h1>

        <section class="options">
          ${(q.options || []).map((opt, i) => renderOption(opt, q.id, i)).join("")}
        </section>

        <footer class="qfooter">
          Reply in chat with your choice — an option letter, a hybrid, your own answer, or <kbd>skip</kbd>.
        </footer>
      `;

      // Wire up option click-to-pin
      main.querySelectorAll(".option:not(.option--open) .option__head").forEach(head => {
        head.addEventListener("click", () => head.parentElement.classList.toggle("pinned"));
      });

      // Render any Mermaid diagrams
      const mermaidNodes = main.querySelectorAll(".mermaid");
      if (mermaidNodes.length) {
        if (!mermaidInitialized) {
          mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base", themeVariables: mermaidThemeVars() });
          mermaidInitialized = true;
        }
        for (const node of mermaidNodes) {
          const id = node.dataset.mid;
          const source = node.dataset.source;
          try {
            const { svg } = await mermaid.render(id, source);
            node.innerHTML = svg;
          } catch (e) {
            node.innerHTML = `<pre class="code">Mermaid parse error:\n${escapeHtml(String(e.message || e))}\n\n${escapeHtml(source)}</pre>`;
          }
        }
      }

      // Refresh sidebar active state
      document.querySelectorAll("#toc li").forEach(li => li.classList.remove("active"));
      const idx = (state.session?.questions || []).findIndex(q => q.id === state.active);
      const tocLi = document.querySelectorAll("#toc li")[idx];
      if (tocLi) tocLi.classList.add("active");
    }

    function mermaidThemeVars() {
      const cs = getComputedStyle(document.documentElement);
      return {
        background: cs.getPropertyValue("--surface").trim(),
        primaryColor: cs.getPropertyValue("--surface").trim(),
        primaryTextColor: cs.getPropertyValue("--text").trim(),
        primaryBorderColor: cs.getPropertyValue("--accent").trim(),
        lineColor: cs.getPropertyValue("--text-dim").trim(),
        fontFamily: cs.getPropertyValue("--font-body").trim(),
        fontSize: "15px",
      };
    }

    function renderVisual(v, idBase) {
      if (!v) return `<p class="empty">No visual.</p>`;
      switch (v.type) {
        case "mermaid":
          return `<div class="mermaid-wrap"><div class="mermaid" data-mid="${idBase}" data-source="${escapeAttr(v.source || "")}">Loading…</div></div>`;
        case "code":
          return `<pre class="code">${v.filename ? `<span class="filename">${escapeHtml(v.filename)}</span>` : ""}${highlightCode(v.source || "", v.highlights)}</pre>`;
        case "two-worlds":
          return `<div class="two-worlds">
            <div class="world"><h4>${escapeHtml(v.left?.title || "Option A")}</h4>${renderVisual(v.left?.body, idBase + "-l")}</div>
            <div class="world"><h4>${escapeHtml(v.right?.title || "Option B")}</h4>${renderVisual(v.right?.body, idBase + "-r")}</div>
          </div>`;
        case "html":
          return v.source || "";
        default:
          return `<p class="empty">Unknown visual type: ${escapeHtml(v.type)}</p>`;
      }
    }

    function renderOption(opt, qid, i) {
      if (opt.kind === "open") {
        return `
          <article class="option option--open">
            <header class="option__head">
              <span class="option__letter">·</span>
              <span class="option__title">${escapeHtml(opt.title || "Open question")}</span>
            </header>
            <div class="option__body">
              ${opt.shape ? `<h5>What a good answer looks like</h5><p>${opt.shape}</p>` : ""}
              ${opt.examples?.length ? `<h5>Illustrative examples (not exhaustive)</h5><ul>${opt.examples.map(e => `<li>${e}</li>`).join("")}</ul>` : ""}
              ${opt.rationale ? `<h5>Recommended framing</h5><p>${opt.rationale}</p>` : ""}
            </div>
          </article>`;
      }
      const letter = opt.letter || String.fromCharCode(65 + i);
      return `
        <article class="option">
          <header class="option__head">
            <span class="option__letter">${escapeHtml(letter)}</span>
            <span class="option__title">${escapeHtml(opt.title || "")}</span>
            ${opt.recommended ? `<span class="option__rec">Recommended</span>` : `<span></span>`}
            <span class="option__summary">${opt.summary || ""}</span>
          </header>
          <div class="option__body">
            ${opt.detail ? `<h5>Detail</h5><p>${opt.detail}</p>` : ""}
            ${opt.miniVisual ? `<div class="option__mini">${renderVisual(opt.miniVisual, `viz-${qid}-o${i}`)}</div>` : ""}
            ${opt.recommended && opt.rationale ? `<h5>Why this is recommended</h5><p>${opt.rationale}</p>` : ""}
            ${opt.downstream ? `<h5>Downstream consequences</h5><p>${opt.downstream}</p>` : ""}
            ${opt.conflict ? `<div class="option__conflict"><strong>Conflict:</strong> ${opt.conflict}</div>` : ""}
          </div>
        </article>`;
    }

    // ─── Util ──────────────────────────────────────────────────────
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/\n/g, "&#10;");
    }
    function highlightCode(src, highlights) {
      // highlights: array of substrings to wrap in <span class="hl">
      let out = escapeHtml(src);
      if (Array.isArray(highlights)) {
        for (const h of highlights) {
          const esc = escapeHtml(h).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          out = out.replace(new RegExp(esc, "g"), m => `<span class="hl">${m}</span>`);
        }
      }
      return out;
    }

    // ─── Kick off ──────────────────────────────────────────────────
    setStatus("connecting");
    pollOnce();
    setInterval(pollOnce, POLL_MS);

    // Keyboard nav: ←/→ to switch questions
    document.addEventListener("keydown", e => {
      if (!state.session) return;
      const ids = (state.session.questions || []).map(q => q.id);
      const idx = ids.indexOf(state.active);
      if (e.key === "ArrowLeft" && idx > 0) { state.active = ids[idx - 1]; renderActive(); renderSidebar(state.session); }
      if (e.key === "ArrowRight" && idx >= 0 && idx < ids.length - 1) { state.active = ids[idx + 1]; renderActive(); renderSidebar(state.session); }
    });
  </script>
</body>
</html>
